          Clean, modern design that works perfectly on all devices.

      </header>

      <section class="tiles">

        <article class="style1">
          <span class="image"><img src="images/pic01.jpg" alt="" /></span>
          <a href="#">
            <h2 data-en="Projects" data-ar="المشاريع">Projects</h2>

              <p data-en="View our latest work"

              </p>
            </div>
          </a>
        </article>

        <article class="style2">
          <span class="image"><img src="images/pic02.jpg" alt="" /></span>
          <a href="#">
            <h2 data-en="Services" data-ar="الخدمات">Services</h2>
            <div class="content">
              <p data-en="What we offer"
                 data-ar="ما الذي نقدمه">
                 What we offer
              </p>
            </div>
          </a>
        </article>

        <article class="style3">
          <span class="image"><img src="images/pic03.jpg" alt="" /></span>
          <a href="#">
            <h2 data-en="About Us" data-ar="من نحن">About Us</h2>
            <div class="content">
              <p data-en="Learn more about us"
                 data-ar="تعرف علينا أكثر">
                 Learn more about us
              </p>
            </div>
          </a>
        </article>

      </section>
    </div>
  </div>

  <!-- FOOTER -->
  <footer id="footer">

      <section>
        <h2 data-en="Get in touch" data-ar="تواصل معنا">Get in touch</h2>
        <form>
          <div class="fields">
            <div class="field half">
              <input type="text" placeholder="Name"
                     data-en="Name" data-ar="الاسم" />
            </div>
            <div class="field half">
              <input type="email" placeholder="Email"
                     data-en="Email" data-ar="البريد الإلكتروني" />
            </div>
            <div class="field">
              <textarea placeholder="Message"
                        data-en="Message" data-ar="الرسالة"></textarea>
            </div>
          </div>
          <ul class="actions">
            <li>
              <input type="submit"
                     value="Send"
                     data-en="Send"
                     data-ar="إرسال" />
            </li>
          </ul>
        </form>
      </section>

      <ul class="copyright">
        <li data-en="All rights reserved"
            data-ar="جميع الحقوق محفوظة">

<!-- SCRIPTS -->
<script src="assets/js/jquery.min.js"></script>

<script src="assets/js/breakpoints.min.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/main.js"></script>

<!-- LANGUAGE TOGGLE SCRIPT -->
<script>
  let currentLang = 'en';
  const toggle = document.getElementById('langToggle');

  toggle.onclick = () => {
    currentLang = currentLang === 'en' ? 'ar' : 'en';

    document.querySelectorAll('[data-en]').forEach(el => {
      el.textContent = el.getAttribute('data-' + currentLang);
    });

    if (currentLang === 'ar') {
      document.documentElement.lang = 'ar';
      document.documentElement.dir = 'rtl';
      document.body.classList.add('ar');
      toggle.textContent = 'EN';
    } else {
      document.documentElement.lang = 'en';
      document.documentElement.dir = 'ltr';
      document.body.classList.remove('ar');
      toggle.textContent = 'AR';
    }
  };
</script>

</body>
</html>
